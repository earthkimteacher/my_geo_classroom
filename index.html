*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{background:var(--s-sp1);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 28px 72px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:16px;font-weight:600;color:var(--on-scene)}
.hero{min-height:min(72svh,640px);display:flex;flex-direction:column;justify-content:center;color:var(--on-scene);padding:40px 0 60px}
.hero h1{font-size:clamp(40px,7vw,92px);font-weight:800;letter-spacing:-.035em;line-height:1.05;overflow-wrap:break-word;min-width:0}
.hero p{font-size:clamp(17px,1.8vw,22px);font-weight:500;margin-top:16px;opacity:.92}
section{width:min(100%,760px);margin-top:min(22vh,200px);padding:26px 26px 22px;border-radius:22px;background:var(--panel);box-shadow:0 18px 50px var(--shadow)}
section:first-child{margin-top:0}
section:nth-of-type(even){margin-left:auto}
section.ext{margin-left:0}
section.wide{width:100%}
section h2{display:flex;align-items:baseline;gap:12px;font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:16px}
section h2 span{font-size:17px;font-weight:600;color:var(--muted)}
.rows{list-style:none;display:grid;gap:10px}
.row{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:14px 18px;border-radius:var(--r-card);background:var(--rowbg);border:1.5px solid transparent;transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--accent);transform:translateY(-1px)}
.ico{width:56px;height:56px;border-radius:14px;background:var(--surface);color:var(--ink)}
.ico svg{display:block;width:100%;height:100%}
.row .unit{font-size:15px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.row .unit.simu{color:var(--sim)}
.row .tt{font-size:21px;font-weight:700;line-height:1.35}
.row .main::after{content:'';position:absolute;inset:0;border-radius:var(--r-card)}
.row .note{font-size:15px;color:var(--muted)}
.row .side{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;white-space:nowrap}
.dev{color:var(--dev);border:1.5px solid currentColor;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700}
.pdf{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.pdf:hover{border-color:var(--accent);color:var(--accent)}
.pdf svg,.out svg{width:14px;height:14px}
.ext .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:18px;font-weight:700}
.ext .kind{font-size:14px;font-weight:600;color:var(--muted)}
.out{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);white-space:nowrap}
.ext .box{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--surface)}
.ext iframe{display:block;width:100%;height:min(75vh,760px);border:0;background:var(--surface)}
.tips{margin-top:min(22vh,200px);padding:22px 26px;border-radius:22px;background:var(--panel);box-shadow:0 18px 50px var(--shadow)}
.tips h2{font-size:19px;font-weight:800;margin-bottom:12px}

.tips kbd{display:inline-block;min-width:28px;padding:1px 7px;margin-right:8px;border-radius:6px;border:1px solid var(--line);background:var(--rowbg);color:var(--ink);font:600 13px var(--font);text-align:center}
footer{margin-top:28px;font-size:14px;color:var(--on-scene)}
footer a{text-decoration:underline}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
footer a:focus-visible{outline-color:var(--on-scene)}

@media (prefers-reduced-motion:reduce){.row{transition:none}.row:hover{transform:none}}

  .row{padding:12px 12px;grid-template-columns:48px minmax(0,1fr);gap:4px 12px}
  .ico{width:48px;height:48px;border-radius:12px}
  .row .side{grid-column:2}
  .row .side:empty{display:none}
  .row .tt{font-size:19px}
  .tips{margin-top:16vh}
}

.visitBox{position:relative;z-index:5}

.visit:hover{border-color:var(--accent)}
.visit:focus-visible,.vbar:focus-visible,.vx:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.visit b{color:var(--ink);font-variant-numeric:tabular-nums}
.visit svg{width:12px;height:12px;transition:transform .2s}
.visit[aria-expanded="true"] svg{transform:rotate(180deg)}
.vpanel{position:absolute;top:calc(100% + 8px);right:0;width:320px;padding:14px 16px 12px;border-radius:var(--r-card,14px);border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 8px 28px var(--shadow)}
.vpanel[hidden]{display:none}
.vh{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
.vx{font:inherit;font-size:20px;line-height:1;color:var(--muted);background:none;border:0;padding:2px 6px;border-radius:8px;cursor:pointer}
.vread{margin:6px 0 10px;font-size:14px;color:var(--muted);min-height:21px}
.vread b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums;margin-left:2px}
.vbars{display:flex;align-items:stretch;gap:2px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:150px;padding:0;font:inherit;background:none;border:0;border-radius:8px;cursor:pointer;color:var(--muted)}
.vbar:hover{background:var(--ground)}
.vnum{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;visibility:hidden}
.vbar[aria-pressed="true"] .vnum{visibility:visible}
.vfill{width:60%;max-width:26px;background:var(--accent);opacity:.35;border-radius:4px 4px 0 0}
.vbar[aria-pressed="true"] .vfill{opacity:1}
.vlab{width:100%;padding-top:5px;border-top:1px solid var(--line);font-size:12px;text-align:center}
.vbar[aria-pressed="true"] .vlab{color:var(--ink);font-weight:700}
@media (max-width:640px){.vpanel{right:auto;left:0;width:min(320px,calc(100vw - 40px))}.visitBox.end .vpanel{left:auto;right:0}}
@media (prefers-reduced-motion:reduce){.visit svg{transition:none}}
</style>

/* 오늘 방문자 수 — Firebase Firestore의 visits/날짜(한국 시간) 문서에 n을 셉니다.
   같은 브라우저는 하루 한 번만 1을 더합니다. 실패하면 숫자 칸을 숨긴 채 둡니다.
   숫자 칸을 누르면 최근 7일 막대그래프가 열리고, 막대(날짜)를 누르면 그날 명수가 나옵니다. */
(()=>{
  const DB='https://firestore.googleapis.com/v1/projects/my-geo-classroom/databases/(default)/documents';
  const KEY='AIzaSyAj_fY9TfF3u62fjEgrcO6Zx_zvV9EEubM';
  const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());   // 2026-11-25
  const $=id=>document.getElementById(id);
  const show=n=>{if(!n)return;$('visitN').textContent=Number(n).toLocaleString('ko-KR');$('visit').hidden=false;};
  let seen=null;try{seen=localStorage.getItem('visitDay');}catch(e){}
  if(seen===day){
    fetch(DB+'/visits/'+day+'?key='+KEY).then(r=>r.ok?r.json():null).then(d=>show(d&&d.fields&&d.fields.n&&d.fields.n.integerValue)).catch(()=>{});
  }else{
    fetch(DB+':commit?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({writes:[{transform:{
      document:'projects/my-geo-classroom/databases/(default)/documents/visits/'+day,
      fieldTransforms:[{fieldPath:'n',increment:{integerValue:'1'}}]}}]})})
    .then(r=>r.ok?r.json():null)
    .then(d=>{const n=d&&d.writeResults&&d.writeResults[0].transformResults&&d.writeResults[0].transformResults[0].integerValue;
      if(n){try{localStorage.setItem('visitDay',day);}catch(e){}show(n);}})
    .catch(()=>{});
  }
  /* 최근 7일 그래프 — 처음 열 때 한 번만 불러옵니다. 기록이 없는 날은 0명 */
  const [y,m,d]=day.split('-').map(Number),days=[];
  for(let i=6;i>=0;i--)days.push(new Date(Date.UTC(y,m-1,d-i)).toISOString().slice(0,10));
  const name=k=>{const t=new Date(k+'T00:00:00Z');return (t.getUTCMonth()+1)+'월 '+t.getUTCDate()+'일('+'일월화수목금토'[t.getUTCDay()]+')';};
  const getN=k=>fetch(DB+'/visits/'+k+'?key='+KEY).then(r=>r.status===404?0:r.ok?r.json().then(j=>Number(j.fields&&j.fields.n&&j.fields.n.integerValue||0)):Promise.reject(r.status));
  const btn=$('visitBtn'),panel=$('vpanel'),bars=$('vbars'),read=$('vread');
  let data=null,sel=6;
  const say=i=>{read.textContent=name(days[i])+' ';read.appendChild(el('b',null,data[i].toLocaleString('ko-KR')));read.append('명');};
  const pick=i=>{sel=i;[...bars.children].forEach((c,j)=>c.setAttribute('aria-pressed',j===i));say(i);};
  const draw=()=>{
    const max=Math.max(1,...data);bars.textContent='';
    days.forEach((k,i)=>{
      const c=el('button','vbar');c.type='button';c.setAttribute('aria-label',name(k)+' '+data[i]+'명');
      const f=el('span','vfill');f.style.height=data[i]?Math.max(4,Math.round(data[i]/max*100))+'px':'2px';
      c.append(el('span','vnum',data[i].toLocaleString('ko-KR')),f,el('span','vlab',i===6?'오늘':k.slice(5).replace('-','/').replace(/^0/,'')));
      c.onclick=()=>pick(i);c.onmouseenter=()=>say(i);c.onmouseleave=()=>say(sel);
      bars.appendChild(c);
    });
    pick(sel);
  };
  const open=o=>{
    panel.hidden=!o;btn.setAttribute('aria-expanded',o);
    if(o&&!data){read.textContent='불러오는 중…';
      Promise.all(days.map(getN)).then(a=>{data=a;draw();}).catch(()=>{read.textContent='기록을 불러오지 못했습니다.';});}
  };
  btn.onclick=()=>open(panel.hidden);
  $('vx').onclick=()=>{open(false);btn.focus();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden){open(false);btn.focus();}});
  document.addEventListener('click',e=>{if(!panel.hidden&&!$('visit').contains(e.target))open(false);});
})();

      if(!SUN.day){const px=W*.62,py=Y(.62),sc=Math.min(W*.42,560),lam=u=>{const xe=Math.cos(6.283*u),ye=Math.sin(6.283*u),a=6.283*u/1.881;return Math.atan2(1.524*Math.sin(a)-ye,1.524*Math.cos(a)-xe);};
      const pos=u=>[px-lam(u)*sc*.62,py-Math.sin(u/.42*Math.PI)*H*.045];
      c.strokeStyle=pal.star;c.globalAlpha=.5;c.lineWidth=1.5;c.setLineDash([2,8]);c.lineCap='round';c.beginPath();for(let u=-.42;u<=.42;u+=.006){const[q,r]=pos(u);u===-.42?c.moveTo(q,r):c.lineTo(q,r);}c.stroke();c.setLineDash([]);c.globalAlpha=1;
      const[qx,qy]=pos(((t*.02)%.84)-.42);c.fillStyle=pal.coral;c.beginPath();c.arc(qx,qy,5,0,6.3);c.fill();}
    }
    /* 구름·비·바람 */
    if(Y(1.15)<H&&Y(2)>0){
      c.strokeStyle=pal.cloud;c.lineCap='round';
      for(let i=0;i<5;i++){const y0=Y(1.42+i*.115),A=H*.02,L=W*.32+i*40;c.globalAlpha=.55;c.lineWidth=2.2;c.setLineDash([26,34]);c.lineDashOffset=-t*(34+i*9);c.beginPath();for(let x=-20;x<=W+20;x+=16){const y=y0+A*Math.sin(x/L*6.283+i*1.7);x<0?c.moveTo(x,y):c.lineTo(x,y);}c.stroke();}
      c.setLineDash([]);c.globalAlpha=1;
      clouds.forEach(k=>{const x=((k.x+t*k.v)%1.3-.15)*W,y=Y(k.y),s=k.s*Math.max(.7,Math.min(1.5,W/900));if(y<-80||y>H+80)return;
        if(k.rain){c.strokeStyle=pal.wave2;c.lineWidth=2.4;c.globalAlpha=.8;for(let i=0;i<8;i++){const f=((t*.9+i*.37)%1),rx=x+(i*12-10)*s,ry=y+26*s+f*H*.11;c.beginPath();c.moveTo(rx,ry);c.lineTo(rx-5,ry+13);c.stroke();}c.globalAlpha=1;}
        c.fillStyle=pal.cloud;c.globalAlpha=.96;cloud(x,y,s);c.globalAlpha=1;});
      /* 라디오존데(관측 풍선) */
      const bx=W*.08,by=Y(1.95-((t*.012)%.8));c.strokeStyle=pal.cloud;c.lineWidth=1.4;c.beginPath();c.moveTo(bx,by+14);c.lineTo(bx,by+46);c.stroke();c.fillStyle=pal.coral;c.beginPath();c.ellipse(bx,by,12,15,0,0,6.3);c.fill();c.fillStyle=pal.paper;c.fillRect(bx-5,by+46,10,9);
    }
    /* 바다 */
    if(Y(2)<H+40){
      /* 섬과 등대(물결보다 뒤) */
      const ix=W*.9,iy=Y(2);c.fillStyle=pal.isle;c.beginPath();c.moveTo(ix-W*.13,iy+20);c.quadraticCurveTo(ix-W*.03,iy-H*.1,ix+W*.02,iy-H*.07);c.quadraticCurveTo(ix+W*.07,iy-H*.05,ix+W*.12,iy+20);c.fill();
      c.fillStyle=pal.paper;c.beginPath();c.moveTo(ix-6,iy-H*.075);c.lineTo(ix-3.5,iy-H*.075-34);c.lineTo(ix+3.5,iy-H*.075-34);c.lineTo(ix+6,iy-H*.075);c.fill();c.fillStyle=pal.coral;c.fillRect(ix-5,iy-H*.075-42,10,8);
      [['wave1',0],['wave2',1]].forEach(([k,n])=>{c.fillStyle=pal[k];c.beginPath();c.moveTo(0,H+10);for(let x=0;x<=W+12;x+=12)c.lineTo(x,surf(x,n));c.lineTo(W,H+10);c.fill();});
      /* 관측 부표 */
      const ux=W*.26,uy=surf(ux,0);c.save();c.translate(ux,uy);c.rotate(.08*Math.sin(t*.9));c.fillStyle=pal.coral;c.fillRect(-9,-12,18,14);c.fillStyle=pal.paper;c.fillRect(-2,-34,4,22);c.beginPath();c.arc(0,-36,4,0,6.3);c.fill();c.restore();
      g=c.createLinearGradient(0,Y(2),0,Y(3.6));[[0,'se0'],[.3,'se1'],[.7,'se2'],[1,'se3']].forEach(([o,k])=>g.addColorStop(o,pal[k]));c.fillStyle=g;c.beginPath();c.moveTo(0,H+10);for(let x=0;x<=W+12;x+=12)c.lineTo(x,surf(x,2));c.lineTo(W,H+10);c.fill();
      /* 물속으로 드는 빛 */
      c.fillStyle=pal.ray;for(let i=0;i<5;i++){const x0=W*(.1+i*.2)+40*Math.sin(t*.2+i),top=Y(2)+30;c.globalAlpha=.07+.03*Math.sin(t*.5+i*2);c.beginPath();c.moveTo(x0,top);c.lineTo(x0+60,top);c.lineTo(x0-80,top+H*.9);c.lineTo(x0-220,top+H*.9);c.fill();}c.globalAlpha=1;
      /* 해류 */
      c.strokeStyle=pal.ray;c.lineWidth=2;for(let i=0;i<4;i++){const y0=Y(2.5+i*.2),L=W*.5;c.globalAlpha=.3;c.setLineDash([30,44]);c.lineDashOffset=(i%2?1:-1)*t*(20+i*5);c.beginPath();for(let x=-20;x<=W+20;x+=18){const y=y0+H*.018*Math.sin(x/L*6.283+i);x<0?c.moveTo(x,y):c.lineTo(x,y);}c.stroke();}c.setLineDash([]);c.globalAlpha=1;
      /* 공기 방울 */
      c.strokeStyle=pal.ray;c.lineWidth=1.3;bubbles.forEach(b=>{const yw=3.45-((b.y+t*b.v)%1)*1.38,y=Y(yw);if(y<-10||y>H+10)return;c.globalAlpha=.5*Math.min(1,(yw-2.06)*8);if(c.globalAlpha<=0)return;c.beginPath();c.arc(b.x*W+8*Math.sin(t+b.ph),y,b.r,0,6.3);c.stroke();});c.globalAlpha=1;
      /* 해저: 열수 분출과 지층 */
      if(Y(3.2)<H){
        const vx=W*.72,vy=Y(bed(vx));smoke.forEach(s=>{const f=(s.ph+t*.07)%1;c.globalAlpha=.42*(1-f);c.fillStyle=pal.rock;c.beginPath();c.arc(vx+s.dx*70*f+10*Math.sin(t+s.ph*9),vy-f*H*.3,6+f*26,0,6.3);c.fill();});c.globalAlpha=1;
        ['bed1','bed2','bed3','bed4'].forEach((k,n)=>{c.fillStyle=pal[k];c.beginPath();c.moveTo(0,H+10);for(let x=0;x<=W+12;x+=12)c.lineTo(x,Y(bed(x)+n*.1+(n?.012*Math.sin(x/W*9+n*2):0)));c.lineTo(W,H+10);c.fill();});
        const mg=c.createRadialGradient(vx,Y(4.02),10,vx,Y(4.02),H*.32);mg.addColorStop(0,pal.magma);mg.addColorStop(1,'transparent');c.fillStyle=mg;c.globalAlpha=.8+.15*Math.sin(t*1.2);c.fillRect(vx-H*.4,Y(3.6),H*.8,H*.5);c.globalAlpha=1;
        c.strokeStyle=pal.magma;c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(vx,Y(3.98));c.quadraticCurveTo(vx-14,Y(3.7),vx,vy+6);c.stroke();
      }
    }
  }
  const frame=ms=>{if(!last)last=ms;t+=Math.min(.05,(ms-last)/1000);last=ms;draw();requestAnimationFrame(frame);};
  readPal();resize();scroll();
  addEventListener('resize',()=>{resize();scroll();if(STILL)draw();});
  addEventListener('scroll',()=>{scroll();if(STILL)draw();},{passive:true});
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{readPal();if(STILL)draw();});
  if(STILL){t=14;draw();}else requestAnimationFrame(frame);
})();
</script>
</body>
