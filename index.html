<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과학 수업 자료 - 진광고등학교 교사 김덕영</title>
<meta name="description" content="진광고등학교 교사 김덕영의 과학 수업 슬라이드와 시뮬레이터를 모았습니다.">
<meta property="og:title" content="과학 수업 자료 - 진광고등학교 교사 김덕영">
<meta property="og:description" content="진광고등학교 교사 김덕영의 과학 수업 슬라이드와 시뮬레이터를 모았습니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  earth.esbest.net 첫 화면(수업 자료 목록).
  자료를 추가할 때는 아래 <script>의 SUBJECTS 배열만 고칩니다.
  - 과목 순서: 학년 순, 같은 학년은 가나다순
  - 과목 안 items: 단원 번호 순(I.01 → I.06 → II.01 …). 단원 번호가 없는 시뮬레이터는 unit을 비웁니다.
  - 학생용 PDF가 있으면 pdf에 경로를 적습니다(과목폴더/PDF/파일.pdf). 카드에 '학생용 PDF ↓' 단추가 생깁니다.
  - 아직 다듬는 중인 자료는 dev:true를 적습니다. 카드 제목 줄에 '개발중' 표시가 붙습니다.
  - 과목의 바깥 자료실(노션 등)은 links에 적습니다: {type,title,href,embed}. 그 과목 카드 아래에 구분선을 긋고
    embed(노션은 https://워크스페이스.notion.site/ebd/페이지ID)를 늘 펼친 상자로 보여 줍니다(제목 줄 오른쪽에 '새 탭으로 열기').
  README.md의 '수업 자료' 목록도 같은 내용으로 함께 고칩니다.
-->
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --t2:#6e6e73; --line:#e5e5ea;
  --act:#0066cc; --sim:#1E8B3E; --dev:#C93400; --shadow:rgba(0,0,0,.08);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--t2:#a1a1a6;--line:#2c2c2e;--act:#2997ff;--sim:#30D158;--dev:#FF9F0A}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}   /* 좁은 화면에서 옆으로 밀리지 않게 */
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:56px 24px 64px}
header{margin-bottom:44px}
header .eb{font-size:17px;font-weight:600;color:var(--t2)}
header h1{font-size:clamp(32px,5vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:6px;text-wrap:balance}
header p{font-size:18px;color:var(--t2);margin-top:12px}
section{margin-top:40px}
section h2{display:flex;align-items:baseline;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.01em;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
section h2 span{font-size:16px;font-weight:600;color:var(--t2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}   /* 300px보다 좁은 화면에서는 카드가 화면 폭에 맞춤 */
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:16px;padding:20px 22px;border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--shadow);border-color:var(--act)}
.card .top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.card .unit{color:var(--act)}
.card .tag{padding:2px 10px;border-radius:9999px;font-size:13px;background:color-mix(in srgb,var(--act) 12%,transparent);color:var(--act)}
.card .tag.sim{background:color-mix(in srgb,var(--sim) 14%,transparent);color:var(--sim)}
.card .tag.dev{background:color-mix(in srgb,var(--dev) 14%,transparent);color:var(--dev)}   /* 개발중 표시 */
.card .tt{font-size:20px;font-weight:700;line-height:1.35;text-wrap:balance}   /* 두 줄 제목의 줄 길이를 고르게 */
.card .note{font-size:15px;color:var(--t2)}
.card .go{margin-top:auto;padding-top:8px;font-size:15px;font-weight:600;color:var(--act)}
.card .main::after{content:'';position:absolute;inset:0;border-radius:16px}   /* 카드 어디를 눌러도 열기 */
.card .acts{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:8px}
.card .acts .go{margin:0;padding:0}
.card .pdf{position:relative;z-index:1;font-size:14px;font-weight:600;padding:4px 12px;border-radius:9999px;border:1px solid var(--line);color:var(--ink)}
.card .pdf:hover{border-color:var(--act);color:var(--act)}
.ext{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}   /* 구분선 */
.ext .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:17px;font-weight:700}
.ext .hd .tag{padding:2px 10px;border-radius:9999px;font-size:13px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.ext .hd a{margin-left:auto;font-size:14px;font-weight:600;color:var(--act);white-space:nowrap}
.ext .box{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.ext iframe{display:block;width:100%;height:min(75vh,760px);border:0;background:var(--card)}
.tips{margin-top:56px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px}
.tips h2{font-size:18px;font-weight:700;margin-bottom:10px}
.tips ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 20px;font-size:15px;color:var(--t2)}
.tips kbd{display:inline-block;min-width:26px;padding:1px 7px;margin-right:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px var(--font);text-align:center}
footer{margin-top:40px;font-size:14px;color:var(--t2)}
footer a{text-decoration:underline}
/* 키보드(Tab)로 고를 때 지금 위치를 또렷하게 */
a:focus-visible{outline:3px solid var(--act);outline-offset:3px;border-radius:6px}
@supports selector(:has(*)){
  .card .main:focus-visible{outline:none}
  .card:has(.main:focus-visible){outline:3px solid var(--act);outline-offset:3px}   /* 제목 대신 카드 전체에 테두리 */
}
/* 기기에서 '움직임 줄이기'를 켜면 카드가 들썩이지 않게 */
@media (prefers-reduced-motion:reduce){
  .card{transition:border-color .2s}
  .card:hover{transform:none}
}
/* 오늘 방문자 수(Firebase) — 머리 오른쪽 위, 좁은 화면에서는 제목 위. 누르면 최근 7일 막대그래프 */
header{position:relative}
.visitBox{position:absolute;top:0;right:0;z-index:5}
.visitBox[hidden]{display:none}
.visit{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:15px;font-weight:600;color:var(--t2);padding:5px 14px;border-radius:9999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.visit:hover{border-color:var(--act)}
.visit:focus-visible,.vbar:focus-visible,.vx:focus-visible{outline:3px solid var(--act);outline-offset:3px}
.visit b{color:var(--ink);font-variant-numeric:tabular-nums}
.visit i{width:8px;height:8px;border-radius:50%;background:var(--sim);display:inline-block}
.visit em{font-style:normal;font-size:11px;transition:transform .2s}
.visit[aria-expanded="true"] em{transform:rotate(180deg)}
.vpanel{position:absolute;top:calc(100% + 8px);right:0;width:320px;padding:14px 16px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:0 8px 28px var(--shadow)}
.vpanel[hidden]{display:none}
.vh{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:var(--ink)}
.vx{font:inherit;font-size:20px;line-height:1;color:var(--t2);background:none;border:0;padding:2px 6px;border-radius:8px;cursor:pointer}
.vread{margin:6px 0 10px;font-size:14px;color:var(--t2);min-height:21px}
.vread b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums;margin-left:2px}
.vbars{display:flex;align-items:stretch;gap:2px;border-top:0}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:150px;padding:0;font:inherit;background:none;border:0;border-radius:8px;cursor:pointer;color:var(--t2)}
.vbar:hover{background:var(--bg)}
.vnum{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;visibility:hidden}
.vbar[aria-pressed="true"] .vnum{visibility:visible}
.vfill{width:60%;max-width:26px;background:var(--act);opacity:.35;border-radius:4px 4px 0 0}
.vbar[aria-pressed="true"] .vfill{opacity:1}
.vlab{width:100%;padding-top:5px;border-top:1px solid var(--line);font-size:12px;text-align:center}
.vbar[aria-pressed="true"] .vlab{color:var(--ink);font-weight:700}
@media (max-width:640px){
  .visitBox{position:relative;display:inline-block;margin-bottom:14px}
  .vpanel{left:0;right:auto;width:min(320px,calc(100vw - 48px))}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="visitBox" id="visit" hidden>
      <button class="visit" id="visitBtn" type="button" aria-expanded="false" aria-controls="vpanel" title="최근 7일 방문자 보기"><i></i><span>오늘 방문자 <b id="visitN"></b>명</span><em aria-hidden="true">▾</em></button>
      <div class="vpanel" id="vpanel" hidden role="dialog" aria-label="최근 7일 방문자">
        <div class="vh"><span>최근 7일 방문자</span><button class="vx" id="vx" type="button" aria-label="닫기">×</button></div>
        <div class="vread" id="vread" aria-live="polite"></div>
        <div class="vbars" id="vbars"></div>
      </div>
    </div>
    <div class="eb">진광고등학교 · 교사 김덕영</div>
    <h1>과학 수업 자료</h1>
    <p>수업 슬라이드와 시뮬레이터를 모았습니다. 카드를 누르면 바로 열립니다.</p>
  </header>
  <main id="list"></main>
  <div class="tips">
    <h2>슬라이드 사용법</h2>
    <ul>
      <li><kbd>→</kbd>다음 (클릭·Space도 가능)</li>
      <li><kbd>←</kbd>이전</li>
      <li><kbd>O</kbd>목차</li>
      <li><kbd>N</kbd>발표자 노트</li>
      <li><kbd>L</kbd>레이저 포인터</li>
      <li><kbd>M</kbd>책갈피·메모</li>
      <li><kbd>F</kbd>전체 화면</li>
      <li><kbd>?</kbd>도움말</li>
    </ul>
  </div>
  <footer>자료 원본: <a href="https://github.com/earthkimteacher/my_geo_classroom">GitHub 저장소</a></footer>
</div>
<script>
/* 수업 자료 목록 — 자료를 추가·삭제할 때는 여기만 고칩니다 */
const SUBJECTS=[
  {name:'과학탐구실험2',grade:'고1',items:[
    {unit:'I.06',type:'슬라이드',title:'생활 속 문제를 과학으로 해결해 볼까?',note:'학교 주변 환경 탐구',href:'과학탐구실험2/I.06environment.html'},
  ]},
  {name:'통합과학2',grade:'고1',items:[
    {unit:'II.1.3',type:'슬라이드',title:'지구 환경의 변화',note:'복사 평형부터 엘니뇨까지',href:'통합과학2/II.1.3climate.html'},
    {unit:'II.1.3',type:'슬라이드',title:'지구 환경의 변화',note:'새로 만든 판 · 복사 평형부터 대처 방안까지',href:'통합과학2/II.1.3change.html',dev:true},
  ]},
  {name:'지구과학',grade:'고2',items:[
    {unit:'',type:'시뮬레이터',title:'행성의 역행과 순행 시뮬레이터',note:'',href:'지구과학/행성의 역행과 순행 시뮬레이터.html'},
    {unit:'',type:'시뮬레이터',title:'지구 외적 요인(밀란코비치 주기)에 의한 기후 변화 시뮬레이터',note:'',href:'지구과학/밀란코비치 시뮬레이터.html'},
  ]},
  {name:'지구시스템과학',grade:'고2',items:[
    {unit:'II.04',type:'슬라이드',title:'해일',note:'',href:'지구시스템과학/II.04surge.html'},
    {unit:'II.05',type:'슬라이드',title:'조석',note:'',href:'지구시스템과학/II.05tide.html'},
    {unit:'III.01~02',type:'슬라이드',title:'지구의 대기와 생명체 · 지구 열수지',note:'',href:'지구시스템과학/III.01-02atmosphere.html'},
    {unit:'III.03',type:'슬라이드',title:'대기 안정도와 강수',note:'',href:'지구시스템과학/III.03stability.html',pdf:'지구시스템과학/PDF/III.03stability_학생용.pdf'},
    {unit:'III.04~05',type:'슬라이드',title:'기압의 연직 분포와 대기를 움직이는 힘 · 여러 가지 바람',note:'',href:'지구시스템과학/III.04-05wind.html',pdf:'지구시스템과학/PDF/III.04-05wind_학생용.pdf'},
  ],links:[
    {type:'노션',title:'학생용 수업 자료 PDF',href:'https://esbest.notion.site/2-32d4a95fb28280e198bfd571eef92fec',embed:'https://esbest.notion.site/ebd/32d4a95fb28280e198bfd571eef92fec'},
  ]},
];
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const list=document.getElementById('list');
SUBJECTS.forEach(s=>{
  const sec=el('section'),h=el('h2',null,s.name);h.appendChild(el('span',null,s.grade));sec.appendChild(h);
  const grid=el('div','grid');
  s.items.forEach(it=>{
    const card=el('div','card');
    const top=el('div','top');
    if(it.unit)top.appendChild(el('span','unit',it.unit+'.'));
    top.appendChild(el('span','tag'+(it.type==='시뮬레이터'?' sim':''),it.type));
    if(it.dev)top.appendChild(el('span','tag dev','개발중'));
    card.appendChild(top);
    const tt=el('div','tt'),a=el('a','main',it.title);a.href=encodeURI(it.href);tt.appendChild(a);card.appendChild(tt);
    if(it.note)card.appendChild(el('div','note',it.note));
    const acts=el('div','acts');acts.appendChild(el('span','go','열기 →'));
    if(it.pdf){const p=el('a','pdf','학생용 PDF ↓');p.href=encodeURI(it.pdf);p.setAttribute('download','');acts.appendChild(p);}
    card.appendChild(acts);
    grid.appendChild(card);
  });
  sec.appendChild(grid);
  (s.links||[]).forEach(L=>{   // 바깥 자료실(노션 등): 구분선 아래 늘 펼친 상자
    const w=el('div','ext'),hd=el('div','hd');
    hd.appendChild(el('span','tag',L.type));hd.appendChild(el('span',null,L.title));
    const out=el('a',null,'새 탭으로 열기 ↗');out.href=L.href;out.target='_blank';out.rel='noopener';hd.appendChild(out);w.appendChild(hd);
    if(L.embed){const box=el('div','box'),f=el('iframe');f.src=L.embed;f.title=L.title;f.loading='lazy';box.appendChild(f);w.appendChild(box);}
    sec.appendChild(w);
  });
  list.appendChild(sec);
});
/* 오늘 방문자 수 — Firebase Firestore의 visits/날짜(한국 시간) 문서에 n을 셉니다.
   같은 브라우저는 하루 한 번만 1을 더합니다. 실패하면 숫자 칸을 숨긴 채 둡니다.
   숫자 칸을 누르면 최근 7일 막대그래프가 열리고, 막대(날짜)를 누르면 그날 명수가 나옵니다. */
(()=>{
  const DB='https://firestore.googleapis.com/v1/projects/my-geo-classroom/databases/(default)/documents';
  const KEY='AIzaSyAj_fY9TfF3u62fjEgrcO6Zx_zvV9EEubM';
  const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());   // 2026-11-25
  const $=id=>document.getElementById(id);
  const show=n=>{if(!n)return;$('visitN').textContent=Number(n).toLocaleString('ko-KR');$('visit').hidden=false;};
  let seen=null;try{seen=localStorage.getItem('visitDay');}catch(e){}
  if(seen===day){
    fetch(DB+'/visits/'+day+'?key='+KEY).then(r=>r.ok?r.json():null).then(d=>show(d&&d.fields&&d.fields.n&&d.fields.n.integerValue)).catch(()=>{});
  }else{
    fetch(DB+':commit?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({writes:[{transform:{
      document:'projects/my-geo-classroom/databases/(default)/documents/visits/'+day,
      fieldTransforms:[{fieldPath:'n',increment:{integerValue:'1'}}]}}]})})
    .then(r=>r.ok?r.json():null)
    .then(d=>{const n=d&&d.writeResults&&d.writeResults[0].transformResults&&d.writeResults[0].transformResults[0].integerValue;
      if(n){try{localStorage.setItem('visitDay',day);}catch(e){}show(n);}})
    .catch(()=>{});
  }
  /* 최근 7일 그래프 — 처음 열 때 한 번만 불러옵니다. 기록이 없는 날은 0명 */
  const [y,m,d]=day.split('-').map(Number),days=[];
  for(let i=6;i>=0;i--)days.push(new Date(Date.UTC(y,m-1,d-i)).toISOString().slice(0,10));
  const name=k=>{const t=new Date(k+'T00:00:00Z');return (t.getUTCMonth()+1)+'월 '+t.getUTCDate()+'일('+'일월화수목금토'[t.getUTCDay()]+')';};
  const getN=k=>fetch(DB+'/visits/'+k+'?key='+KEY).then(r=>r.status===404?0:r.ok?r.json().then(j=>Number(j.fields&&j.fields.n&&j.fields.n.integerValue||0)):Promise.reject(r.status));
  const btn=$('visitBtn'),panel=$('vpanel'),bars=$('vbars'),read=$('vread');
  let data=null,sel=6;
  const say=i=>{read.textContent=name(days[i])+' ';read.appendChild(el('b',null,data[i].toLocaleString('ko-KR')));read.append('명');};
  const pick=i=>{sel=i;[...bars.children].forEach((c,j)=>c.setAttribute('aria-pressed',j===i));say(i);};
  const draw=()=>{
    const max=Math.max(1,...data);bars.textContent='';
    days.forEach((k,i)=>{
      const c=el('button','vbar');c.type='button';c.setAttribute('aria-label',name(k)+' '+data[i]+'명');
      const f=el('span','vfill');f.style.height=data[i]?Math.max(4,Math.round(data[i]/max*100))+'px':'2px';
      c.append(el('span','vnum',data[i].toLocaleString('ko-KR')),f,el('span','vlab',i===6?'오늘':k.slice(5).replace('-','/').replace(/^0/,'')));
      c.onclick=()=>pick(i);c.onmouseenter=()=>say(i);c.onmouseleave=()=>say(sel);
      bars.appendChild(c);
    });
    pick(sel);
  };
  const open=o=>{
    panel.hidden=!o;btn.setAttribute('aria-expanded',o);
    if(o&&!data){read.textContent='불러오는 중…';
      Promise.all(days.map(getN)).then(a=>{data=a;draw();}).catch(()=>{read.textContent='기록을 불러오지 못했습니다.';});}
  };
  btn.onclick=()=>open(panel.hidden);
  $('vx').onclick=()=>{open(false);btn.focus();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden){open(false);btn.focus();}});
  document.addEventListener('click',e=>{if(!panel.hidden&&!$('visit').contains(e.target))open(false);});
})();
</script>
</body>
</html>
