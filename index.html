<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과학 수업 자료 - 진광고등학교 교사 김덕영</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  earth.esbest.net 첫 화면(수업 자료 목록).
  자료를 추가할 때는 아래 <script>의 SUBJECTS 배열만 고칩니다.
  - 과목 순서: 학년 순, 같은 학년은 가나다순
  - 과목 안 items: 단원 번호 순(I.01 → I.06 → II.01 …). 단원 번호가 없는 시뮬레이터는 unit을 비웁니다.
  - 학생용 PDF가 있으면 pdf에 경로를 적습니다(과목폴더/PDF/파일.pdf). 카드에 '학생용 PDF ↓' 단추가 생깁니다.
  README.md의 '수업 자료' 목록도 같은 내용으로 함께 고칩니다.
-->
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --t2:#6e6e73; --line:#e5e5ea;
  --act:#0066cc; --sim:#1E8B3E;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--t2:#a1a1a6;--line:#2c2c2e;--act:#2997ff;--sim:#30D158}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:56px 24px 64px}
header{margin-bottom:44px}
header .eb{font-size:17px;font-weight:600;color:var(--t2)}
header h1{font-size:clamp(32px,5vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:6px}
header p{font-size:18px;color:var(--t2);margin-top:12px}
section{margin-top:40px}
section h2{display:flex;align-items:baseline;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.01em;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
section h2 span{font-size:16px;font-weight:600;color:var(--t2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:16px;padding:20px 22px;border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08);border-color:var(--act)}
.card .top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.card .unit{color:var(--act)}
.card .tag{padding:2px 10px;border-radius:9999px;font-size:13px;background:color-mix(in srgb,var(--act) 12%,transparent);color:var(--act)}
.card .tag.sim{background:color-mix(in srgb,var(--sim) 14%,transparent);color:var(--sim)}
.card .tt{font-size:20px;font-weight:700;line-height:1.35}
.card .note{font-size:15px;color:var(--t2)}
.card .go{margin-top:auto;padding-top:8px;font-size:15px;font-weight:600;color:var(--act)}
.card .main::after{content:'';position:absolute;inset:0;border-radius:16px}   /* 카드 어디를 눌러도 열기 */
.card .acts{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:8px}
.card .acts .go{margin:0;padding:0}
.card .pdf{position:relative;z-index:1;font-size:14px;font-weight:600;padding:4px 12px;border-radius:9999px;border:1px solid var(--line);color:var(--ink)}
.card .pdf:hover{border-color:var(--act);color:var(--act)}
.tips{margin-top:56px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px}
.tips h3{font-size:18px;font-weight:700;margin-bottom:10px}
.tips ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 20px;font-size:15px;color:var(--t2)}
.tips kbd{display:inline-block;min-width:26px;padding:1px 7px;margin-right:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px var(--font);text-align:center}
footer{margin-top:40px;font-size:14px;color:var(--t2)}
footer a{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eb">진광고등학교 · 교사 김덕영</div>
    <h1>과학 수업 자료</h1>
    <p>수업 슬라이드와 시뮬레이터를 모았습니다. 카드를 누르면 바로 열립니다.</p>
  </header>
  <main id="list"></main>
  <div class="tips">
    <h3>슬라이드 사용법</h3>
    <ul>
      <li><kbd>→</kbd>다음 (클릭·Space도 가능)</li>
      <li><kbd>←</kbd>이전</li>
      <li><kbd>O</kbd>목차</li>
      <li><kbd>N</kbd>발표자 노트</li>
      <li><kbd>L</kbd>레이저 포인터</li>
      <li><kbd>M</kbd>책갈피·메모</li>
      <li><kbd>F</kbd>전체 화면</li>
      <li><kbd>?</kbd>도움말</li>
    </ul>
  </div>
  <footer>자료 원본: <a href="https://github.com/earthkimteacher/my_geo_classroom">GitHub 저장소</a></footer>
</div>
<script>
/* 수업 자료 목록 — 자료를 추가·삭제할 때는 여기만 고칩니다 */
const SUBJECTS=[
  {name:'과학탐구실험2',grade:'고1',items:[
    {unit:'I.06',type:'슬라이드',title:'생활 속 문제를 과학으로 해결해 볼까?',note:'학교 주변 환경 탐구 1차시',href:'과학탐구실험2/I.06environment.html'},
  ]},
  {name:'지구과학',grade:'고2',items:[
    {unit:'',type:'시뮬레이터',title:'행성의 역행과 순행 시뮬레이터',note:'',href:'지구과학/행성의 역행과 순행 시뮬레이터.html'},
    {unit:'',type:'시뮬레이터',title:'지구 외적 요인(밀란코비치 주기)에 의한 기후 변화 시뮬레이터',note:'',href:'지구과학/밀란코비치 시뮬레이터.html'},
  ]},
  {name:'지구시스템과학',grade:'고2',items:[
    {unit:'II.05',type:'슬라이드',title:'조석',note:'13·14차시',href:'지구시스템과학/II.05tide.html',pdf:'지구시스템과학/PDF/II.05tide_학생용.pdf'},
  ]},
];
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const list=document.getElementById('list');
SUBJECTS.forEach(s=>{
  const sec=el('section'),h=el('h2',null,s.name);h.appendChild(el('span',null,s.grade));sec.appendChild(h);
  const grid=el('div','grid');
  s.items.forEach(it=>{
    const card=el('div','card');
    const top=el('div','top');
    if(it.unit)top.appendChild(el('span','unit',it.unit+'.'));
    top.appendChild(el('span','tag'+(it.type==='시뮬레이터'?' sim':''),it.type));
    card.appendChild(top);
    const tt=el('div','tt'),a=el('a','main',it.title);a.href=encodeURI(it.href);tt.appendChild(a);card.appendChild(tt);
    if(it.note)card.appendChild(el('div','note',it.note));
    const acts=el('div','acts');acts.appendChild(el('span','go','열기 →'));
    if(it.pdf){const p=el('a','pdf','학생용 PDF ↓');p.href=encodeURI(it.pdf);p.setAttribute('download','');acts.appendChild(p);}
    card.appendChild(acts);
    grid.appendChild(card);
  });
  sec.appendChild(grid);list.appendChild(sec);
});
</script>
</body>
</html>
